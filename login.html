<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Areja’s Boarding House</title>
    <link rel="stylesheet" href="/resources/css/app.css" />
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <header class="site-header border-b border-gray-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 text-white">ABH</div>
          <div class="leading-tight">
            <a href="/" class="text-base font-semibold">Areja’s Boarding House</a>
            <p class="text-xs text-gray-500">Dormitory Management System</p>
          </div>
        </div>
        <nav class="hidden items-center gap-6 text-sm sm:flex">
          <a href="/" class="text-gray-600 hover:text-gray-900">Home</a>
          <a href="/login" class="rounded-md border border-gray-300 px-3 py-1.5 text-gray-700 hover:bg-gray-100">Admin Login</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto flex max-w-6xl items-center justify-center px-4 py-12 sm:px-6 sm:py-16">
      <div class="w-full max-w-md">
        <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <h1 class="text-center text-2xl font-semibold">Sign in</h1>
          <p class="mt-1 text-center text-sm text-gray-600">Use your admin, staff, or tenant account</p>
          <form id="loginForm" method="POST" action="/login" class="mt-6 space-y-4">
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
              <input id="email" name="email" type="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
            </div>
            <div>
              <div class="flex items-center justify-between">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <a href="/forgot-password" class="text-sm text-blue-600 hover:text-blue-700">Forgot?</a>
              </div>
              <input id="password" name="password" type="password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
            </div>
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input id="remember" type="checkbox" name="remember" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                Remember me
              </label>
              <a href="/register" class="text-sm text-gray-600 hover:text-gray-900">Create account</a>
            </div>
            <button type="submit" class="w-full rounded-md bg-blue-600 px-4 py-2.5 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Sign in</button>
          </form>
          <p class="mt-4 text-center text-xs text-gray-500">Note: Requires the Laravel backend to be running.</p>
        </div>
      </div>
    </main>

    <script type="module" src="/resources/js/app.js"></script>
    <script>
      async function getCookie(name){
        const m = document.cookie.match('(?:^|; )' + name.replace(/([.$?*|{}()\\[\\]\\\\\/+^])/g,'\\$1') + '=([^;]*)');
        return m ? decodeURIComponent(m[1]) : null;
      }
      async function ensureXsrfCookie() {
        try { await fetch('/sanctum/csrf-cookie', { credentials: 'include' }); } catch {}
      }
      async function login(e){
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;
        await ensureXsrfCookie();
        const xsrf = await getCookie('XSRF-TOKEN');
        const headers = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
        if (xsrf) headers['X-XSRF-TOKEN'] = xsrf;
        const res = await fetch('/login', {
          method: 'POST',
          headers,
          credentials: 'include',
          body: JSON.stringify({ email, password, remember })
        });
        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          alert('Login failed.');
        }
      }
      document.getElementById('loginForm')?.addEventListener('submit', login);
    </script>
  </body>
</html>
